title: "[Idea]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Feature requests live here, bugs go to the Issues
  - type: textarea
    id: idea
    attributes:
      label: What's the idea
      description: What should gloview do that it doesn't do today?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What's missing in your workflow right now?
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: How you picture it working
      description: Keybinds, config options, what you'd see on screen
    validations:
      required: false
